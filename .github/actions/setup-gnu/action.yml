---
name: 'Setup GNU Toolchain'
description: 'Download RISC-V GNU Toolchain'
inputs:
  archive-url:
    description: Optional prebuilt toolchain archive URL instead of the riscv-tools release URL
    default: ''
  strip-components:
    description: Leading archive path components to strip when extracting
    default: '0'
  install-dir:
    description: 'Install directory'
    required: true
    default: ''
  version:
    description: 'TC version'
    required: true
    default: '?'
  name:
    description: 'TC name'
    required: true
    default: '?'
  variant:
    description: 'TC variant'
    required: true
    default: '?'
  os:
    description: 'Operating System'
    required: true
    default: '?'
  enable-summary:
    description: 'Enable Job Summary'
    required: true
outputs: {}

runs:
  using: "composite"
  steps:
    - name: Download RISCV-GNU-Toolchain
      if: ${{ inputs.enable-summary == 'true' }}
      shell: bash
      run: |
        echo "GCC Cache Miss -> downloading toolchain" >> $GITHUB_STEP_SUMMARY

    - name: Download RISCV-GNU-Toolchain
      shell: bash
      env:
        ARCHIVE_URL: ${{ inputs.archive-url }}
        STRIP_COMPONENTS: ${{ inputs.strip-components }}
      run: |
        mkdir ${{ inputs.install-dir }}
        if [[ -z "$ARCHIVE_URL" ]]; then
          ARCHIVE_URL="https://github.com/PhilippvK/riscv-tools/releases/download/gnu_${{ inputs.version }}/${{ inputs.name }}-${{ inputs.os }}-${{ inputs.variant }}.tar.xz"
        fi
        wget "$ARCHIVE_URL" -O ${{ inputs.install-dir }}.tar.xz
        cd ${{ inputs.install-dir }}
        tar xf ${{ inputs.install-dir }}.tar.xz --strip-components="$STRIP_COMPONENTS"
        cd ..
        rm ${{ inputs.install-dir }}.tar.xz
