name: setup-m2isar
description: Create the M2-ISA-R virtual environment and install the checked-out source.
inputs:
  source-dir:
    description: M2-ISA-R source directory
    required: false
    default: M2-ISA-R
  python-version:
    description: Python version used to create venv
    required: false
    default: '3.10'
  summary-message:
    description: Optional job summary message
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: Install M2-ISA-R
    shell: bash
    env:
      SOURCE_DIR: ${{ inputs.source-dir }}
      PYTHON_VERSION: ${{ inputs.python-version }}
      SUMMARY_MESSAGE: ${{ inputs.summary-message }}
    run: |
      cd "$SOURCE_DIR"
      virtualenv -p "python$PYTHON_VERSION" venv
      source venv/bin/activate
      pip install -e .
      if [[ -n "$SUMMARY_MESSAGE" ]]; then
        echo "$SUMMARY_MESSAGE" >> "$GITHUB_STEP_SUMMARY"
      fi
